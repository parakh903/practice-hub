      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
        <div style="flex:1;min-width:150px;">
          ${!testContext?`<span class="tag ${q.subject}">${q.subject}</span>`:''}${q.topic?`<span class="tag diff">${esc(q.topic)}</span>`:''}${isReal?`<span class="tag diff">posted ${formatDate(q.createdAt)}</span>`:''}${isReal?(()=>{
            const pending = state.pendingDelete && state.pendingDelete.type==='question' && state.pendingDelete.id===q.id;
            return `<span class="qrow-edit" style="color:var(--maths);font-size:0.72rem;cursor:pointer;margin-left:6px;">edit</span><span class="qrow-del" style="color:var(--bad);font-size:0.72rem;cursor:pointer;margin-left:8px;font-weight:${pending?'700':'400'};">${pending?'confirm remove?':'delete'}</span>`;
          })():''}
          <div style="font-size:0.85rem;margin-top:4px;">${esc((q.prompt||'(question no longer in bank — remove it from this test)').slice(0,140))}${(q.prompt||'').length>140?'…':''}</div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;flex:0 0 auto;">${pillsHtml}</div>
      </div>
    </div>
  </div>`);
  const wrapper=el(`<div></div>`);
  const body = row.querySelector('.qrow-body');
  if(anyCell) body.addEventListener('click', (e)=>{ if(e.target.closest('.qrow-edit')||e.target.closest('.qrow-del')) return; if(expandedRows.has(rowKey)) expandedRows.delete(rowKey); else expandedRows.add(rowKey); render(); });
  const editBtn = row.querySelector('.qrow-edit');
  if(editBtn) editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); startEditQuestion(q); });
  const delBtn = row.querySelector('.qrow-del');
  if(delBtn) delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteQuestion(q.id); });
  const selectCb = row.querySelector('.qrow-select');
  if(selectCb) selectCb.addEventListener('change', (e)=>{ e.stopPropagation(); if(e.target.checked) selectedQIds.add(q.id); else selectedQIds.delete(q.id); render(); });
  wrapper.appendChild(row);
  if(open && anyCell){
    const detail=el(`<div style="padding:2px 0 12px 8px;"></div>`);
    cells.forEach(({child,cell})=>{
      if(!cell){ detail.appendChild(el(`<div class="mini" style="margin:6px 0;"><span style="color:${childColor(child.id)};font-weight:600;">${esc(child.name)}</span>: not attempted yet.</div>`)); return; }
      const correctKey = cell.correctAnswer ?? q.correctAnswer ?? (q.type==='mcq' && q.options ? q.options[q.correctIndex] : null);
      const solution = cell.solution ?? q.solution;
      const statusColor = cell.needsReview?'var(--mid-text)':(cell.correct?'var(--good)':'var(--bad)');
      const statusText = cell.needsReview?'possible correct — needs review':(cell.correct?'correct':'incorrect');
      detail.appendChild(el(`<div style="margin:6px 0;padding:8px 10px;background:rgba(0,0,0,0.04);border-radius:4px;">
        <div class="mini" style="font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;"><span style="color:${childColor(child.id)};font-weight:600;">${esc(child.name)}</span> &middot; ${new Date(cell.date).toLocaleDateString()}</div>
        <div class="mini" style="margin-top:3px;">Given: <strong>${esc(String(cell.given??'—'))}</strong>${correctKey?` &middot; Answer key: <strong>${esc(correctKey)}</strong>`:''} &middot; <span style="color:${statusColor};font-weight:600;">${statusText}</span></div>
        ${solution?`<div class="mini" style="margin-top:5px;"><em>Solution:</em> ${esc(solution)}</div>`:''}
      </div>`));
    });
    wrapper.appendChild(detail);
  }
  return wrapper;
}

// One collapsible group per test — header shows each child's overall score
// for that test; expanding it reveals every question inside via the same
// per-question comparison row used for standalone questions.
function renderTestCompareGroup(t){
  const key='cmp-test-'+t.id;
  const open = expandedRows.has(key);
  const isPending = state.pendingDelete && state.pendingDelete.type==='test' && state.pendingDelete.id===t.id;
  const pillsHtml = state.children.map(c=>{
    const nameSpan = `<span style="color:${childColor(c.id)};">${esc(shortName(c.name))}</span>`;
    const r = latestAttempt(c.id,'test',t.id);
    if(!r) return `<span class="score-pill" style="opacity:0.45;background:transparent;border:1px solid var(--line);">${nameSpan}: —</span>`;
    const pct = r.maxScore? r.score/r.maxScore*100 : 0;
    return `<span class="score-pill ${scoreLabel(pct)}">${nameSpan}: ${r.score}/${r.maxScore}</span>`;
  }).join(' ');
  const head=el(`<div class="card subj-${t.subject}" style="padding:12px 16px;cursor:pointer;margin-bottom:${open?'0':'10px'};position:relative;">
    <span class="close-x test-del" style="${isPending?'color:var(--bad);font-weight:600;':''}">${isPending?'confirm remove?':'remove'}</span>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <div>
        <span style="display:inline-block;transition:transform .15s;transform:rotate(${open?'0':'-90'}deg);margin-right:4px;">▾</span>
        <span class="tag ${t.subject}">${t.subject}</span><span class="tag diff">Test</span>
        <div style="margin-top:6px;font-size:0.92rem;font-weight:500;">${esc(t.title||'Untitled test')}</div>
        <div class="mini" style="margin-top:3px;">posted ${formatDate(t.createdAt)} &middot; ${(t.questionIds||[]).length} question${(t.questionIds||[]).length===1?'':'s'}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">${pillsHtml}</div>
    </div>
  </div>`);
  head.addEventListener('click', (e)=>{ if(e.target.closest('.test-del')) return; if(expandedRows.has(key)) expandedRows.delete(key); else expandedRows.add(key); render(); });
  head.querySelector('.test-del').addEventListener('click', (e)=>{ e.stopPropagation(); deleteTest(t.id); });
  const wrapper=el(`<div></div>`);
  wrapper.appendChild(head);
  if(open){
    const body=el(`<div class="card" style="padding:2px 16px;margin-top:-1px;margin-bottom:10px;border-top:none;border-top-left-radius:0;border-top-right-radius:0;"></div>`);
    (t.questionIds||[]).forEach(qid=>{
      const q = state.qbank.find(x=>x.id===qid) || {id:qid, prompt:'(question no longer in bank)', subject:t.subject};
      body.appendChild(renderQuestionCompareRow(q, t));
    });
    if(body.lastChild) body.lastChild.style.borderBottom='none';
    wrapper.appendChild(body);
  }
  return wrapper;
}

function renderResults(){
  const app=document.getElementById('app');
  if(state.children.length===0){
    app.appendChild(el(`<div class="empty">Add a child in the Manage tab to see questions and results.</div>`));
    return;
  }
  app.appendChild(el(`<h2 class="section-title">Questions</h2>`));
  app.appendChild(el(`<div class="mini" style="margin:-10px 0 14px;">Everything about your question bank lives here — see how both kids did, add or edit questions, and build tests.</div>`));
  app.appendChild(renderSubjectFilter());
  app.appendChild(renderResultsTestFilter());
  app.appendChild(renderResultsDateFilter());

  const dateRange = computeResultsDateRange();
  const subjPasses = subj => state.subjectFilter==='All' || subj===state.subjectFilter;
  const usedInTestIds = questionIdsUsedInTests();

  let tests = state.tests.filter(t=>subjPasses(t.subject) && inRange(t.createdAt,dateRange));
  // A question in a test lives under that test's group, not also in the flat
  // list below — same "one home only" rule as Practice, just applied here too.
  let questions = state.qbank.filter(q=>subjPasses(q.subject) && inRange(q.createdAt,dateRange) && !usedInTestIds.has(q.id));
  if(state.resultsTestFilter==='standalone'){ tests=[]; }
  else if(state.resultsTestFilter!=='all'){ tests=tests.filter(t=>t.id===state.resultsTestFilter); questions=[]; }
  tests.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  questions.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  selectedQIds.forEach(id=>{ if(!questions.some(q=>q.id===id)) selectedQIds.delete(id); }); // drop stale selections when filters change

  // Needs review — merged across every child, since it's the same triage
  // queue regardless of whose answer is waiting on a judgement call.
  const reviewItems=[];
  state.children.forEach(c=>{
    (state.results[c.id]||[]).forEach(r=>{
      if(r.type==='question' && r.needsReview && !r.reviewResolved){
        reviewItems.push({resultId:r.id, kind:'question', subject:r.subject, topic:r.topic,
          prompt:r.detail?.[0]?.prompt, given:r.detail?.[0]?.given, qId:r.refId, marks:r.marks||1,
          correct:false, needsReview:true, correctAnswer:r.detail?.[0]?.correctAnswer, solution:r.detail?.[0]?.solution,
          childName:c.name, childId:c.id});
      } else if(r.type==='test'){
        (r.detail||[]).forEach((d,i)=>{
          if(d.needsReview && !d.reviewResolved){
            reviewItems.push({resultId:r.id, kind:'test', detailIndex:i, subject:d.subject, topic:d.topic,
              prompt:d.prompt, given:d.given, qId:d.qId, marks:d.marks||1, testTitle:r.title,
              correct:false, needsReview:true, correctAnswer:d.correctAnswer, solution:d.solution,
              childName:c.name, childId:c.id});
          }
        });
      }
    });
  });
  if(reviewItems.length){
    app.appendChild(sectionHeader('results-needsreview', `⚠ Possible correct — needs review (${reviewItems.length})`));
    if(!collapsedSections['results-needsreview']){
      const queueCard=el(`<div class="card" style="padding:10px 16px;"></div>`);
      reviewItems.forEach(item=>queueCard.appendChild(renderAnswerItemRow(item)));
      if(queueCard.lastChild) queueCard.lastChild.style.borderBottom='none';
      app.appendChild(queueCard);
    }
  }

  app.appendChild(renderChildSummaryCards(tests, questions));
  if(state.subjectFilter==='All' && state.resultsTestFilter==='all'){
    app.appendChild(renderSubjectCompareRow(dateRange));
  }

  const resultsKeys=[];
  app.appendChild(expandCollapseBar(()=>resultsKeys));

  resultsKeys.push('results-topics');
  app.appendChild(sectionHeader('results-topics', 'Topic breakdown'));
  if(!collapsedSections['results-topics']){
    app.appendChild(el(`<div class="mini" style="margin:-4px 0 8px;">Sorted weakest first — whichever child is struggling more on a topic decides its place. Topics nobody's tried yet sit at the bottom.</div>`));
    app.appendChild(renderTopicBreakdown(tests, questions));
  }

  if(tests.length){
    resultsKeys.push('results-tests');
    app.appendChild(sectionHeader('results-tests', `Tests (${tests.length})`));
    if(!collapsedSections['results-tests']){
      tests.forEach(t=>app.appendChild(renderTestCompareGroup(t)));
    }
  }
  if(questions.length){
    resultsKeys.push('results-standalone');
    app.appendChild(sectionHeader('results-standalone', `Standalone questions (${questions.length})`));
    if(!collapsedSections['results-standalone']){
      if(selectedQIds.size){
        const bar=el(`<div class="card" style="padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-left:5px solid var(--bad);">
          <span class="mini">${selectedQIds.size} selected</span>
          <div style="display:flex;gap:8px;">
            <button class="btn secondary" id="qsel-clear">Clear</button>
            <button class="btn danger" id="qsel-delete">Delete selected</button>
          </div>
        </div>`);
        bar.querySelector('#qsel-clear').addEventListener('click', ()=>{ selectedQIds.clear(); render(); });
        bar.querySelector('#qsel-delete').addEventListener('click', ()=>{
          const n=selectedQIds.size;
          if(!confirm(`Delete ${n} question${n===1?'':'s'}? This can't be undone.`)) return;
          const ids=[...selectedQIds];
          selectedQIds.clear();
          (async()=>{ for(const id of ids){ await performDeleteQuestion(id); } })();
        });
        app.appendChild(bar);
      }
      const card=el(`<div class="card" style="padding:2px 16px;"></div>`);
      questions.forEach(q=>card.appendChild(renderQuestionCompareRow(q, null)));
      if(card.lastChild) card.lastChild.style.borderBottom='none';
      app.appendChild(card);
    }
  }
  if(!tests.length && !questions.length){
    app.appendChild(el(`<div class="empty">Nothing matches these filters.</div>`));
  }

  // ---- Add / build tools — same forms and functions Manage used to host ----
  resultsKeys.push('results-bulkq');
  app.appendChild(sectionHeader('results-bulkq', 'Bulk add questions'));
  if(!collapsedSections['results-bulkq']){
    const bulkCard=el(`<div class="card">
      <div class="mini" style="margin-bottom:8px;">Paste a block of questions (ask Claude for a batch in this format) and add them all in one go — no need to fill in the form for each one.</div>
      <textarea id="bulk-text" style="min-height:140px;font-family:var(--font-mono);font-size:0.78rem;" placeholder='[{"subject":"Maths","difficulty":"Extension","type":"mcq","topic":"Indices","timeMinutes":2,"marks":1,"prompt":"...","options":["A","B","C","D"],"correctIndex":0,"solution":"..."}]'>${esc(state.bulkText)}</textarea>
      <div style="margin-top:12px;display:flex;align-items:center;gap:12px;">
        <button class="btn" id="bulk-import-btn">Import all</button>
        ${state.bulkMsg?`<span class="mini" style="color:${state.bulkMsg.startsWith('Added')?'var(--good)':'var(--bad)'};">${esc(state.bulkMsg)}</span>`:''}
      </div>
    </div>`);
    bulkCard.querySelector('#bulk-text').addEventListener('input', e=>{ state.bulkText=e.target.value; });
    bulkCard.querySelector('#bulk-import-btn').addEventListener('click', bulkImport);
    app.appendChild(bulkCard);
  }

  resultsKeys.push('results-addq');
  app.appendChild(sectionHeader('results-addq', qForm.editId ? 'Edit question' : 'Add a single question to the bank'));
  if(!collapsedSections['results-addq']){
    const qf=el(renderQForm());
    app.appendChild(qf);
    const typeFieldsContainer=qf.querySelector('#qf-type-fields');
    renderQTypeFields(typeFieldsContainer);
    qf.querySelector('#qf-subject').addEventListener('change', e=>{ qForm.subject=e.target.value; });
    qf.querySelector('#qf-difficulty').addEventListener('change', e=>{ qForm.difficulty=e.target.value; });
    qf.querySelector('#qf-type').addEventListener('change', e=>{ qForm.type=e.target.value; renderQTypeFields(typeFieldsContainer); });
    qf.querySelector('#qf-save').addEventListener('click', saveQuestion);
    if(qf.querySelector('#qf-cancel')) qf.querySelector('#qf-cancel').addEventListener('click', cancelEditQuestion);
  }

  resultsKeys.push('results-buildtest');
  app.appendChild(sectionHeader('results-buildtest', 'Build a timed test'));
  if(!collapsedSections['results-buildtest']){
    const tf=el(renderTestForm());
    app.appendChild(tf);
    tf.querySelector('#tf-title').addEventListener('input', e=>{ testForm.title=e.target.value; });
    tf.querySelector('#tf-subject').addEventListener('change', e=>{ testForm.subject=e.target.value; testForm.questionIds=new Set(); testForm.timeLimitTouched=false; render(); });
    tf.querySelector('#tf-time').addEventListener('input', e=>{ testForm.timeLimitTouched=true; testForm.timeLimitMins=+e.target.value||testForm.timeLimitMins; });
    tf.querySelectorAll('.tf-check').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const id=e.target.dataset.id;
        if(e.target.checked) testForm.questionIds.add(id); else testForm.questionIds.delete(id);
        if(!testForm.timeLimitTouched) testForm.timeLimitMins=Math.max(5, Math.ceil(sumMinutes(testForm.questionIds)));
        render();
      });
    });
    tf.querySelector('#tf-save').addEventListener('click', saveTest);
  }
}
function renderResultsBody(){ render(); }

// ---------- ROOT RENDER ----------
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  if(!state.loaded){
    app.appendChild(el(`<div class="empty">Loading…</div>`));
    return;
  }
  app.appendChild(el(`
    <header class="top">
      <h1>Practice Hub</h1>
      <div class="tagline">extension practice · year 8 → hsc</div>
    </header>`));

  const backupBanner = renderBackupBanner();
  if(backupBanner) app.appendChild(backupBanner);
  const inactivityBanner = renderInactivityBannerCombined();
  if(inactivityBanner) app.appendChild(inactivityBanner);

  const nav=el(`<nav class="tabs"></nav>`);
  [['practice','Practice'],['results','Questions'],['reference','Reference'],['manage','Manage']].forEach(([id,label])=>{
    const b=el(`<button class="${state.tab===id?'active':''}">${label}</button>`);
    b.addEventListener('click', ()=>setTab(id));
    nav.appendChild(b);
  });
  app.appendChild(nav);

  if(state.tab!=='manage' && state.tab!=='reference'){
    const bar=el(`<div class="child-bar"><span class="label">Student</span></div>`);
    state.children.forEach(c=>{
      const active = state.currentChild===c.id;
      const col = childColor(c.id), colBg = childColorBg(c.id);
      const chip=el(`<div class="chip ${active?'active':''}" style="${active?`background:${col};border-color:${col};color:#0A0A0A;`:`border-color:${col};color:${col};background:${colBg};`}">${esc(c.name)}</div>`);
      chip.addEventListener('click', ()=>{ state.currentChild=c.id; setRememberedChild(c.id); state.activeAttempt=null; render(); });
      bar.appendChild(chip);
    });
    bar.appendChild(buildAddChildControl('chip'));
    app.appendChild(bar);
  }

  if(state.tab==='practice') renderPractice();
  else if(state.tab==='results') renderResults();
  else if(state.tab==='reference') renderReference();
  else if(state.tab==='manage') renderManage();
}

let listenersStarted=false;
auth.onAuthStateChanged(user=>{
  if(user && !listenersStarted){
    listenersStarted=true;
    initListeners();
  }
});
auth.signInAnonymously().catch(err=>{
  console.error('Anonymous sign-in failed', err);
  render(); // still render the (empty/loading) shell so the page isn't blank on failure
});
</script>
</body>
</html>
